services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command:
      - --innodb-file-per-table=1
      - --lower-case-table-names=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-librenms}
      MYSQL_USER: ${MYSQL_USER:-librenms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 5

  librenms:
    image: librenms/librenms:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-America/Chicago}
      LIBRENMS_BASE_URL: ${LIBRENMS_BASE_URL:?required}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:?required}
      SESSION_SECURE_COOKIE: "true"
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./data/librenms:/data

  dispatcher:
    image: librenms/librenms:latest
    restart: unless-stopped
    depends_on:
      librenms:
        condition: service_started
    environment:
      TZ: ${TZ:-America/Chicago}
      LIBRENMS_BASE_URL: ${LIBRENMS_BASE_URL:?required}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:?required}
      SESSION_SECURE_COOKIE: "true"
      SIDECAR_DISPATCHER: "1"
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./data/librenms:/data
